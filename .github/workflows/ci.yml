name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze (infos allowed, warnings/errors fatal)
        run: flutter analyze --no-fatal-infos

  architecture-guard:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check MVVM boundaries
        run: |
          WARN=0

          echo "=== Check 1: Supabase.instance in view layer ==="
          if grep -rn --include='*.dart' 'Supabase\.instance' lib/features/ | grep '/view/' ; then
            echo "::warning::Direct Supabase access found in view layer"
            WARN=1
          fi

          echo ""
          echo "=== Check 2: View imports in viewmodel layer ==="
          if grep -rn --include='*.dart' "import.*\/view\/" lib/features/ | grep '/viewmodels/' ; then
            echo "::warning::View layer imported in viewmodel"
            WARN=1
          fi

          echo ""
          echo "=== Check 3: Supabase.instance in viewmodel layer ==="
          if grep -rn --include='*.dart' 'Supabase\.instance' lib/features/ | grep '/viewmodels/' ; then
            echo "::warning::Direct Supabase access found in viewmodel layer"
            WARN=1
          fi

          echo ""
          echo "=== Check 4: TextEditingController in viewmodel layer ==="
          if grep -rn --include='*.dart' 'TextEditingController\|GlobalKey<FormState>' lib/features/ | grep '/viewmodels/' ; then
            echo "::warning::UI controllers found in viewmodel layer"
            WARN=1
          fi

          echo ""
          echo "=== Check 5: Navigator calls in viewmodel layer ==="
          if grep -rn --include='*.dart' 'Navigator\.' lib/features/ | grep '/viewmodels/' ; then
            echo "::warning::Navigator calls found in viewmodel layer"
            WARN=1
          fi

          echo ""
          echo "=== Check 6: Repository imports in view layer ==="
          if grep -rn --include='*.dart' 'import.*repository' lib/features/ | grep '/view/' ; then
            echo "::warning::Repository imported directly in view layer"
            WARN=1
          fi

          if [ $WARN -eq 1 ]; then
            echo ""
            echo "::warning::Architecture violations detected. These should be fixed in Phase B."
          else
            echo "All architecture checks passed."
          fi

          # Warning-only for now. Graduate to hard failure after Phase B fixes.
          exit 0

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true
      - run: flutter pub get
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Report coverage
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            TOTAL_LINES=$(grep -c '^DA:' coverage/lcov.info || echo 0)
            HIT_LINES=$(grep '^DA:' coverage/lcov.info | grep -cv ',0$' || echo 0)
            if [ "$TOTAL_LINES" -gt 0 ]; then
              PERCENT=$(awk "BEGIN { printf \"%.1f\", ($HIT_LINES / $TOTAL_LINES) * 100 }")
              echo "### Coverage: ${PERCENT}% ($HIT_LINES / $TOTAL_LINES lines)" >> $GITHUB_STEP_SUMMARY
              echo "Coverage: ${PERCENT}% ($HIT_LINES / $TOTAL_LINES lines)"
            else
              echo "No coverage data found."
            fi
          else
            echo "coverage/lcov.info not generated."
          fi

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [analyze, test]
    strategy:
      matrix:
        include:
          - target: apk
            command: flutter build apk --debug
          - target: web
            command: flutter build web --release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true
      - run: flutter pub get
      - name: Build ${{ matrix.target }}
        run: ${{ matrix.command }}
